name: CI

on:
  push:
    branches:
      - main
      - air
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-haml:
    name: Build HAML
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 💎 Setup Ruby (Latest)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: 📦 Install HAML
        run: gem install haml

      - name: 🚀 Build HAML
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/InvokeHamlBuild.ps1
          Invoke-HamlBuild -StartPath .

  build-stylus:
    name: Build Stylus
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install Stylus
        run: npm install -g stylus

      - name: 🚀 Build Stylus
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
            . ./scripts/InvokeStylBuild.ps1
          Invoke-StylusBuild -StartPath .

  build-ts:
    name: Build TypeScript
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install TypeScript
        run: npm install -g typescript

      - name: 🚀 Build TypeScript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/InvokeTsBuild.ps1
          Invoke-TypeScriptBuild -StartPath .
