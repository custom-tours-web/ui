# ==============================================================================
# WebAssetBuilder Continuous Integration (CI) Workflow
#
# Compiles HAML, Stylus, and TypeScript assets concurrently across isolated jobs
# using the 'WebAssetBuilder' PowerShell module, then merges and validates
# the final distribution bundle.
# ==============================================================================

name: CI

on:
  push:
    branches: [ main, air ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Run Comprehensive Test Suites & Reporting (Quality Gate)
  # ----------------------------------------------------------------------------
  test:
    name: 📊 Run Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. ENVIRONMENT & TOOLING SETUP
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser

      - name: 💎 Setup Ruby (Latest)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install Global CLI Tools
        run: |
          gem install haml
          npm install -g stylus typescript

      - name: 📦 Install App Dependencies
        run: npm install

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # ==========================================
      # 2. TEST & MUTATION EXECUTION
      # ==========================================
      - name: 🧪 Execute Pester Unit Tests
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: ./test.ps1 -TestSuite Unit
        continue-on-error: true

      - name: 🧪 Execute App Unit Tests
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔗 Execute Pester Integration Tests
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: ./test.ps1 -TestSuite Integration
        continue-on-error: true

      - name: 🔗 Execute App Integration Tests
        run: npm run test:coverage:integration
        continue-on-error: true

      - name: 🧩 Execute App Component Tests
        run: npm run test:coverage:component
        continue-on-error: true

      - name: 🤝 Execute App Contract Tests
        run: npm run test:coverage:contract
        continue-on-error: true

      - name: 🌐 Execute App E2E Tests
        run: npm run test:coverage:e2e
        continue-on-error: true

      - name: 🧬 Execute App Mutation Tests
        run: npm run test:mutation
        continue-on-error: true

      # ==========================================
      # 3. UNIT TEST REPORTING
      # ==========================================
      - name: 📋 Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🧪 Unit Test Results"
          files: junit-unit.xml

      - name: 📈 Process Unit Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write UT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🧪 App Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 4. INTEGRATION TEST REPORTING
      # ==========================================
      - name: 📋 Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🔗 Integration Test Results"
          files: junit-integration.xml

      - name: 📈 Process Integration Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/integration/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '25 75'

      - name: 📝 Write IT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🔗 App Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 5. COMPONENT TEST REPORTING
      # ==========================================
      - name: 📋 Publish Component Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🧩 Component Test Results"
          files: "junit-component.xml"

      - name: 📈 Process Component Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/component/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write Component Coverage to Job Summary
        if: always()
        run: |
          echo "### 🧩 Component Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 6. CONTRACT TEST REPORTING
      # ==========================================
      - name: 📋 Publish Contract Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🤝 Contract Test Results"
          files: "junit-contract.xml"

      - name: 📈 Process Contract Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/contract/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write Contract Coverage to Job Summary
        if: always()
        run: |
          echo "### 🤝 Contract Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 7. E2E TEST REPORTING
      # ==========================================
      - name: 📋 Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🌐 E2E Test Results"
          files: "junit-e2e.xml"

      - name: 📈 Process E2E Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/e2e/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write E2E Coverage to Job Summary
        if: always()
        run: |
          echo "### 🌐 E2E Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 8. MUTATION TEST REPORTING
      # ==========================================
      - name: 📝 Write Mutation Report to Summary
        if: always()
        run: |
          echo "### 🧬 Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "reports/mutation/mutation.json" ]; then
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'));
              let total = 0, killed = 0, survived = 0, timeout = 0, noCoverage = 0;

              Object.values(report.files).forEach(file => {
                file.mutants.forEach(m => {
                  total++;
                  if (m.status === 'Killed') killed++;
                  if (m.status === 'Survived') survived++;
                  if (m.status === 'Timeout') timeout++;
                  if (m.status === 'NoCoverage') noCoverage++;
                });
              });

              const validTotal = total - noCoverage;
              const score = validTotal > 0 ? ((killed + timeout) / validTotal * 100).toFixed(2) : '0.00';

              console.log('**Mutation Score:** ' + score + '%');
              console.log('');
              console.log('| Metric | Count |');
              console.log('|--------|-------|');
              console.log('| 👽 Total Mutants | ' + total + ' |');
              console.log('| 💀 Killed | ' + killed + ' |');
              console.log('| 🏃 Survived | ' + survived + ' |');
              console.log('| ⏱️ Timeout | ' + timeout + ' |');
              console.log('| 🙈 No Coverage | ' + noCoverage + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
              echo "⚠️ *Mutation report JSON not found. Check if the json reporter is enabled.*" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 9. ARTIFACT ARCHIVING
      # ==========================================
      - name: 📤 Upload Test & Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-results
          path: |
            **/TestResults/**/*.xml
            **/TestResults/**/*.trx
            coverage/
            reports/
          retention-days: 7
          if-no-files-found: warn

  # ----------------------------------------------------------------------------
  # JOB 2: Compile HAML Templates to HTML
  # ----------------------------------------------------------------------------
  build-haml:
    name: Build HAML
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 💎 Setup Ruby (Latest)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: 📦 Install HAML
        run: gem install haml

      - name: 🚀 Build HAML
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-HamlBuild -StartPath .

      - name: 📤 Upload HAML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haml
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # JOB 3: Compile Stylus Stylesheets to CSS
  # ----------------------------------------------------------------------------
  build-stylus:
    name: Build Stylus
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install Stylus
        run: npm install -g stylus

      - name: 🚀 Build Stylus
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-StylusBuild -StartPath .

      - name: 📤 Upload Stylus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: styl
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # JOB 4: Compile TypeScript Scripts to JavaScript
  # ----------------------------------------------------------------------------
  build-ts:
    name: Build TypeScript
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install TypeScript
        run: npm install -g typescript

      - name: 🚀 Build TypeScript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-TypeScriptBuild -StartPath .

      - name: 📤 Upload TypeScript Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # JOB 5: Aggregate Artifacts & Validate Final Distribution
  # ----------------------------------------------------------------------------
  package:
    name: Package Web Assets
    needs:
      - build-haml
      - build-stylus
      - build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download All Partial Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 🔍 Validate Final Distribution
        shell: pwsh
        run: |
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-WebAssetsValidation -StartPath .

      - name: 📤 Upload Final Bundle
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: dist/
          retention-days: 1
          if-no-files-found: error
