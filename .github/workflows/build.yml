name: CI

on:
  push:
    branches:
      - main
      - air
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-haml:
    name: Build HAML
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 💎 Setup Ruby (Latest)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: 📦 Install HAML
        run: gem install haml

      - name: 🚀 Build HAML
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/InvokeHamlBuild.ps1
          Invoke-HamlBuild -StartPath .

      - name: 📤 Upload HAML Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: haml-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  build-stylus:
    name: Build Stylus
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install Stylus
        run: npm install -g stylus

      - name: 🚀 Build Stylus
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
            . ./scripts/InvokeStylBuild.ps1
          Invoke-StylusBuild -StartPath .

      - name: 📤 Upload Stylus Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stylus-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  build-ts:
    name: Build TypeScript
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*'

      - name: 📦 Install TypeScript
        run: npm install -g typescript

      - name: 🚀 Build TypeScript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/InvokeTsBuild.ps1
          Invoke-TypeScriptBuild -StartPath .

      - name: 📤 Upload TypeScript Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ts-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package Web Assets
    needs:
      - build-haml
      - build-stylus
      - build-ts
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download All Partial Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: 🔍 Validate Final Distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/InvokeWebAssetsValidation.ps1
          Invoke-WebAssetsValidation -StartPath .

      - name: 📤 Upload Final Bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
