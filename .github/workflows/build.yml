# WebAssetBuilder Continuous Integration (CI) Workflow
#
# Compiles HAML, Stylus, & TypeScript assets concurrently across isolated jobs
# using the 'WebAssetBuilder' PowerShell module, then merges & validates
# the final distribution bundle.

name: CI # The name of the GitHub Actions workflow

on:
  push:
    branches: [ main, air ] # Trigger the workflow on pushes to the main & air branches
  pull_request:
    branches: [ main ] # Trigger the workflow on pull requests targeting the main branch
  workflow_dispatch: # Allow the workflow to be triggered manually from the GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # Group concurrent runs by workflow & branch/ref
  cancel-in-progress: true # Cancel any currently running jobs in the same group to save CI minutes

permissions:
  contents: read # Allow reading repository contents
  pull-requests: write # Allow writing to pull requests (e.g., for test reporting comments)
  checks: write # Allow creating & updating GitHub Check Runs

jobs:
  # Consolidated Build, Test, & Package
  build-and-test:
    name: 🚀 Build, Test, & Package Web Assets
    runs-on: ubuntu-latest # Execute the job on an Ubuntu runner

    steps:
      # ENVIRONMENT & TOOLING SETUP
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7 # Check out the repository source code

      - name: 📦 Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser # Install the Pester testing framework for PowerShell

      - name: 💎 Setup Ruby (Latest)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby' # Set up the latest version of Ruby, required for HAML

      - name: 🟢 Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: '*' # Set up the latest version of Node.js

      - name: 📦 Install Global CLI Tools
        run: |
          gem install haml
          npm install -g stylus typescript # Install compilation tools globally

      - name: 📦 Install App Dependencies
        run: npm install # Install project-specific NPM packages

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install chromium --with-deps # Install Playwright dependencies for E2E testing

      # TEST & MUTATION EXECUTION
      # The following steps run various test suites & continue even if they fail (continue-on-error: true) so coverage & reports are still generated
      - name: 🧪 Execute Pester Unit Tests
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: ./test.ps1 -TestSuite Unit
        continue-on-error: true

      - name: 🧪 Execute App Unit Tests
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔗 Execute Pester Integration Tests
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: ./test.ps1 -TestSuite Integration
        continue-on-error: true

      - name: 🔗 Execute App Integration Tests
        run: npm run test:coverage:integration
        continue-on-error: true

      - name: 🧩 Execute App Component Tests
        run: npm run test:coverage:component
        continue-on-error: true

      - name: 🤝 Execute App Contract Tests
        run: npm run test:coverage:contract
        continue-on-error: true

      - name: 🌐 Execute App E2E Tests
        run: npm run test:coverage:e2e
        continue-on-error: true

      - name: 🧬 Execute App Mutation Tests
        run: npm run test:mutation
        continue-on-error: true

      # TEST REPORTING
      - name: 📋 Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Ensure reports are published even if preceding test steps failed
        with:
          check_name: "🧪 Unit Test Results"
          files: coverage/coverage-report.xml

      - name: 📈 Process Unit Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write UT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🧪 App Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Write Pester Coverage to Job Summary
        if: always()
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          "### 🐚 Pester Unit Test Coverage" | Out-File -Append $summaryFile
          "" | Out-File -Append $summaryFile

          # Path from the Pester logs
          $covPath = "TestResults/Unit/coverage-report.xml"

          if (Test-Path $covPath) {
              [xml]$xml = Get-Content $covPath

              "| Metric | Covered | Missed | Total | Coverage % |" | Out-File -Append $summaryFile
              "|--------|---------|--------|-------|------------|" | Out-File -Append $summaryFile

              foreach ($counter in $xml.report.counter) {
                  $type = $counter.type
                  $covered = [int]$counter.covered
                  $missed = [int]$counter.missed
                  $total = $covered + $missed
                  $percent = if ($total -gt 0) { "{0:N2}%" -f (($covered / $total) * 100) } else { "0.00%" }

                  "| **$type** | $covered | $missed | $total | $percent |" | Out-File -Append $summaryFile
              }
          } else {
              "⚠️ *Pester coverage report ($covPath) not found.*" | Out-File -Append $summaryFile
          }

          "" | Out-File -Append $summaryFile
          "---" | Out-File -Append $summaryFile

      # Integration Test Reporting
      - name: 📋 Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🔗 Integration Test Results"
          files: coverage/integration/coverage-report.xml

      - name: 📈 Process Integration Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/integration/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '25 75'

      - name: 📝 Write IT Coverage to Job Summary
        if: always()
        run: |
          echo "### 🔗 App Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: 🔗 Execute Pester Integration Tests
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: ./test.ps1 -TestSuite Integration
        continue-on-error: true

      - name: 📝 Write Pester Integration Coverage to Job Summary
        if: always()
        shell: pwsh
        working-directory: ./WebAssetBuilder/
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          "### 🔗 Pester Integration Test Coverage" | Out-File -Append $summaryFile
          "" | Out-File -Append $summaryFile

          # Path from the Pester integration logs
          $covPath = "TestResults/Integration/coverage-report.xml"

          if (Test-Path $covPath) {
              [xml]$xml = Get-Content $covPath

              "| Metric | Covered | Missed | Total | Coverage % |" | Out-File -Append $summaryFile
              "|--------|---------|--------|-------|------------|" | Out-File -Append $summaryFile

              foreach ($counter in $xml.report.counter) {
                  $type = $counter.type
                  $covered = [int]$counter.covered
                  $missed = [int]$counter.missed
                  $total = $covered + $missed
                  $percent = if ($total -gt 0) { "{0:N2}%" -f (($covered / $total) * 100) } else { "0.00%" }

                  "| **$type** | $covered | $missed | $total | $percent |" | Out-File -Append $summaryFile
              }
          } else {
              "⚠️ *Pester integration coverage report ($covPath) not found.*" | Out-File -Append $summaryFile
          }

          "" | Out-File -Append $summaryFile
          "---" | Out-File -Append $summaryFile

      # Component Test Reporting
      - name: 📋 Publish Component Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🧩 Component Test Results"
          files: "coverage/component/coverage-report.xml"

      - name: 📈 Process Component Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/component/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write Component Coverage to Job Summary
        if: always()
        run: |
          echo "### 🧩 Component Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # Contract Test Reporting
      - name: 📋 Publish Contract Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🤝 Contract Test Results"
          files: "coverage/contract/coverage-report.xml"

      - name: 📈 Process Contract Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/contract/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write Contract Coverage to Job Summary
        if: always()
        run: |
          echo "### 🤝 Contract Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # E2E Test Reporting
      - name: 📋 Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "🌐 E2E Test Results"
          files: "coverage/e2e/coverage-report.xml"

      - name: 📈 Process E2E Test Coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "coverage/e2e/cobertura-coverage.xml"
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '50 75'

      - name: 📝 Write E2E Coverage to Job Summary
        if: always()
        run: |
          echo "### 🌐 E2E Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Coverage report missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # Mutation Test Reporting
      - name: 📝 Write Mutation Report to Summary
        if: always()
        run: |
          if [ -f "reports/mutation/mutation.json" ]; then
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'));
              let total = 0, killed = 0, survived = 0, timeout = 0, noCoverage = 0;

              let fileRows = [];

              Object.entries(report.files).forEach(([filePath, fileData]) => {
                let fTotal = 0, fKilled = 0, fSurvived = 0, fTimeout = 0, fNoCoverage = 0;

                fileData.mutants.forEach(m => {
                  fTotal++; total++;
                  if (m.status === 'Killed') { fKilled++; killed++; }
                  if (m.status === 'Survived') { fSurvived++; survived++; }
                  if (m.status === 'Timeout') { fTimeout++; timeout++; }
                  if (m.status === 'NoCoverage') { fNoCoverage++; noCoverage++; }
                });

                const fValidTotal = fTotal - fNoCoverage;
                const fScore = fValidTotal > 0 ? ((fKilled + fTimeout) / fValidTotal * 100).toFixed(2) : '0.00';

                // Extract just the file name to keep the table clean
                const fileName = filePath.split('/').pop();

                fileRows.push('| ' + fileName + ' | ' + fScore + '% | ' + fTotal + ' | ' + fKilled + ' | ' + fSurvived + ' | ' + fTimeout + ' | ' + fNoCoverage + ' |');
              });

              const validTotal = total - noCoverage;
              const score = validTotal > 0 ? ((killed + timeout) / validTotal * 100).toFixed(2) : '0.00';

              console.log('### 🧬 Mutation Testing Summary');
              console.log('**Overall Mutation Score:** ' + score + '%');
              console.log('');
              console.log('| Metric | Count |');
              console.log('|--------|-------|');
              console.log('| 👽 Total Mutants | ' + total + ' |');
              console.log('| 💀 Killed | ' + killed + ' |');
              console.log('| 🏃 Survived | ' + survived + ' |');
              console.log('| ⏱️ Timeout | ' + timeout + ' |');
              console.log('| 🙈 No Coverage | ' + noCoverage + ' |');
              console.log('');

              console.log('### 📄 Per-File Breakdown');
              console.log('| File | Score | Total | Killed | Survived | Timeout | No Cov |');
              console.log('|------|-------|-------|--------|----------|---------|--------|');
              fileRows.forEach(row => console.log(row));
            " >> $GITHUB_STEP_SUMMARY
          else
              echo "⚠️ *Mutation report JSON not found. Check if the json reporter is enabled.*" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # ASSET COMPILATION & PACKAGING
      - name: 🚀 Build HAML, Stylus & TypeScript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-HamlBuild -StartPath . # Compile HAML templates to HTML
          Invoke-StylusBuild -StartPath . # Compile Stylus stylesheets to CSS
          Invoke-TypeScriptBuild -StartPath . # Compile TypeScript to JavaScript

      - name: 🔍 Validate Final Distribution
        shell: pwsh
        run: |
          Import-Module ./WebAssetBuilder/WebAssetBuilder.psd1 -Force
          Invoke-WebAssetsValidation -StartPath . # Verify the generated distribution bundle

      # ARTIFACT ARCHIVING
      - name: 📤 Upload Test & Coverage Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: all-test-results # Save test reports & coverage data
          path: |
            **/TestResults/**/*.xml
            **/TestResults/**/*.trx
            coverage/
            reports/
          retention-days: 7
          if-no-files-found: warn

      - name: 📤 Upload Final Bundle
        uses: actions/upload-artifact@v7
        with:
          name: assets # Upload the successfully built artifacts from the dist folder
          path: dist/
          retention-days: 1
          if-no-files-found: error
