name-template: '🚀 v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 🏷️ Categorize PRs based on the labels
categories:
  - title: '🚀 Features'
    labels:
      - 'enhancement'
      - 'feature'

  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'

  - title: '♻️ Maintenance & Refactoring'
    labels:
      - 'chore'
      - 'refactor'
      - 'dependencies'

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'

# 🚫 Exclude PRs with these labels from the changelog
exclude-labels:
  - 'skip-changelog'

# 📝 Release notes template
template: |
  ## ✨ What's Changed

  $CHANGES

  ---

  🔗 **Full Changelog:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  💖 **Thank you to everyone who contributed to this release!**
